<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Horizon · Signature</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
</head><body>
<!--
  Event Horizon — a black hole with its accretion disc, light bent all the
  way round.

  Every pixel fires a photon from the camera and integrates its path past
  a Schwarzschild mass (units: horizon radius 1). Using the conserved
  angular momentum h of the ray, the bending is one line,
      a = −1.5 · h² · x / |x|⁵,
  which is exact for light in this metric. That is all it takes for the
  famous picture to appear by itself: the far side of the disc lifted
  over the top and under the bottom, a thin photon ring at 1.5, and the
  star field lensed into arcs near the shadow.
  The disc is thin, crossed possibly several times per ray. Its colour is
  a blackbody ramp on T ∝ r^(−3/4); its texture is fbm in (r, φ − Ω(r)·t)
  with Kepler Ω ∝ r^(−3/2), so inner rings lap outer ones; the approaching
  side is Doppler-beamed brighter and bluer.
  Interaction: drag to orbit (with momentum); hover nudges the camera toward
  the pointer on a spring.  Hash: #tilt=.12&gain=1&dist=16
-->
<script src="studio:sigkit"></script>
<script>
Sig({
  drag: true, spinReturn: 2.2, budget: 1.1e6, t0: 3,
  params: { tilt: 0.11, gain: 0.5, dist: 26.0, hot: '#ffd9a8' },
  rest: [0.5, 0.5],
  onFrame(s, set) {
    const m = Math.min(s.W, s.H) / 2;
    const nx = (s.sp.x - s.W / 2) / m, ny = -(s.sp.y - s.H / 2) / m;
    set('uCam', [s.spin.x * 0.8 + nx * 0.12 * s.sp.h + s.time * 0.02, Math.max(-0.6, Math.min(0.9, s.params.tilt + s.spin.y * 0.5 + ny * 0.08 * s.sp.h))]);
  },
  frag: `
uniform vec2 uCam;                                             // yaw, pitch
vec3 blackbody(float t){                                        // t 0..1 → deep red .. white-blue (linear)
  return clamp(vec3(1., .42 + .58 * t, .12 + .88 * t * t) * (.25 + 1.6 * t * t), 0., 4.);
}
vec3 sky(vec3 d){
  vec3 q = d * 160.;
  vec3 id = floor(q);
  float h = hash13(id);
  vec3 f = fract(q) - .5;
  float star = h > .985 ? exp(-dot(f, f) * 60.) * (h - .985) * 70. : 0.;
  float neb = fbm3(d * 2.2) * .035;
  return vec3(star) + vec3(.35, .45, .9) * neb * neb * 2.;
}
void main(){
  vec2 p = (gl_FragCoord.xy - .5 * uRes) / uRes.y;
  float yaw = uCam.x, pit = uCam.y;
  vec3 ro = u_dist * vec3(sin(yaw) * cos(pit), sin(pit), cos(yaw) * cos(pit));
  vec3 fw = normalize(-ro), rt = normalize(cross(vec3(0., 1., 0.), fw)), up = cross(fw, rt);
  vec3 rd = normalize(fw * 2.3 + rt * p.x + up * p.y);
  vec3 x = ro, v = rd;
  vec3 hv = cross(x, v); float h2 = dot(hv, hv);
  vec3 col = vec3(0.); float trans = 1.;
  bool captured = false;
  for (int i = 0; i < 170; i++) {
    float r = length(x);
    float dt = clamp(.06 * r, .02, .9);
    vec3 a = -1.5 * h2 * x / pow(r, 5.);
    vec3 xn = x + v * dt;
    v = normalize(v + a * dt);
    if (x.y * xn.y < 0.) {                                    // crossed the disc plane
      vec3 c = mix(x, xn, x.y / (x.y - xn.y));
      float rc = length(c.xz);
      if (rc > 2.6 && rc < 11.) {
        float phi = atan(c.z, c.x);
        float om = pow(rc, -1.5);
        float tex = fbm2(vec2(rc * 2.2, (phi - om * uTime * 2.2) * 3.0));
        tex = .15 + 1.3 * pow(tex, 2.6);
        float T = pow(2.6 / rc, .75);
        float edge = smoothstep(2.6, 3.1, rc) * smoothstep(11., 7.5, rc);
        vec3 vel = normalize(vec3(-c.z, 0., c.x)) * sqrt(.5 / rc);  // orbital velocity
        float dop = 1. / (1. - dot(vel, -v) * 1.3);
        dop = pow(dop, 3.);
        vec3 e = blackbody(clamp(T * (.85 + .35 * (dop - 1.)), 0., 1.)) * u_hot * tex * dop * edge;
        float alpha = edge * (.55 + .4 * tex);
        col += trans * e * alpha * 1.6;
        trans *= 1. - alpha * .9;
      }
    }
    x = xn;
    if (r < 1.0) { captured = true; break; }
    if (r > 60.) break;
    if (trans < .02) break;
  }
  if (!captured) col += trans * sky(v);
  col *= u_gain;
  gl_FragColor = vec4(dither(toSrgb(aces(col * 1.1))), 1.);
}`
});
</script>
</body></html>
