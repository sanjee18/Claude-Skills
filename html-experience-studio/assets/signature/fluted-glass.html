<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluted Glass · Signature</title>
<style>html,body{margin:0;height:100%;background:#0b0a12;overflow:hidden}</style>
</head><body>
<!--
  Fluted Glass — soft coloured light seen through a pane of reeded glass.

  Behind the glass: four broad light sources (a mesh gradient in linear
  light), one of which follows the sprung pointer like a lamp carried
  behind the pane. In front: vertical flutes. Each flute is a half
  cylinder, so the image behind it is squeezed and mirrored across its
  width (the sample offset is the cylinder's slope); R, G and B refract by
  slightly different amounts, which leaves a thin spectral edge on every
  flute. A specular line rides each flute where its curve faces the light,
  the grooves between flutes darken, and a fine frost scatters the samples
  so the glass reads as glass, not as stripes painted on.
  Hash: #c1=ff7a45&c2=7a5cff&c3=24c6ff&c4=ffd36e&flutes=24
-->
<script src="studio:sigkit"></script>
<script>
Sig({
  params: { c1: '#ff6a3d', c2: '#6b4dff', c3: '#1fb6ff', c4: '#ffcf6a', base: '#08070d', flutes: 14 },
  rest: [0.66, 0.38],
  frag: `
vec3 behind(vec2 uv){
  float t = uTime * .08;
  vec2 a = vec2(.25 + .12 * sin(t * 1.3), .30 + .10 * cos(t * 1.1));
  vec2 b = vec2(.78 + .08 * cos(t * .9), .70 + .12 * sin(t * 1.4));
  vec2 c = vec2(.55 + .20 * sin(t * .7 + 2.), .12 + .08 * cos(t));
  vec2 m = gl_FragCoord.xy * 0. + (uPtr / uRes);              // the carried lamp
  vec2 asp = vec2(uRes.x / uRes.y, 1.);
  float fa = exp(-dot((uv - a) * asp, (uv - a) * asp) / .10);
  float fb = exp(-dot((uv - b) * asp, (uv - b) * asp) / .12);
  float fc = exp(-dot((uv - c) * asp, (uv - c) * asp) / .08);
  float fm = exp(-dot((uv - m) * asp, (uv - m) * asp) / (.035 + .03 * uHover)) * (.45 + .9 * uHover);
  return u_base + u_c2 * fa * 1.1 + u_c1 * fb * .9 + u_c3 * fc * .8 + u_c4 * fm;
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float w = 1. / u_flutes;
  float xf = uv.x / w;
  float f = fract(xf) - .5;                                   // -.5 .. .5 across one flute
  float nx = f * 2.;                                          // cylinder slope
  float nz = sqrt(max(0., 1. - nx * nx * .92));
  vec2 jit = (hash22(gl_FragCoord.xy + floor(uTime * 24.)) - .5) * .0035;   // frost
  float base = (floor(xf) + .5) * w;
  vec3 col;
  col.r = behind(vec2(base - f * w * 1.30, uv.y) + jit).r;
  col.g = behind(vec2(base - f * w * 1.42, uv.y) + jit).g;
  col.b = behind(vec2(base - f * w * 1.56, uv.y) + jit).b;
  // the glass itself: a highlight where the curve faces the light, a dark groove at the seam
  vec3 Ld = normalize(vec3(-.45 + (uPtr.x / uRes.x - .5) * .6 * uHover, 0., .9));
  float spec = pow(max(0., nx * Ld.x + nz * Ld.z), 90.) * .07 + pow(max(0., nx * Ld.x + nz * Ld.z), 8.) * .015;
  float groove = smoothstep(.40, .5, abs(f));
  col = col * (1. - .35 * groove) + vec3(spec) * (.4 + .6 * smoothstep(0., 1., uv.y));
  col += vec3(.9, .95, 1.) * exp(-abs(abs(f) - .47) * 160.) * .008;   // the hairline at each flute edge
  gl_FragColor = vec4(dither(toSrgb(aces(col * 1.2))), 1.);
}`
});
</script>
</body></html>
