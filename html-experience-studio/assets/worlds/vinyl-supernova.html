<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only dark">
<title>Vinyl Supernova · Referenz-Welt</title>
<!-- Referenz-Welt: "Vinyl Supernova" (Partikel-Schwarm, three.js r147 aus dem Skill, offline).
     Original (vom Nutzer geliefert): r160 über CDN, 20.000 Tetraeder, CPU-Schleife + GPGPU-Textur pro Frame.
     Hier: dieselbe Choreografie, aber jedes Partikel ist eine reine Funktion (Index-Hash, Zeit) im Vertex-Shader
     -> keine CPU-Schleife, keine Datentextur, 30.000+ Partikel bei 60 fps. Details: references/worlds.md -->
<style>
html,body{margin:0;height:100%;background:#020203;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.cap{position:fixed;left:28px;bottom:24px;color:#8b8f99;font:500 11px/1.6 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
.cap b{color:#d8dbe2;font-weight:500}
.ph{position:fixed;right:28px;bottom:24px;width:160px;pointer-events:none}
.ph i{display:block;height:1px;background:rgba(216,219,226,.22)}.ph u{display:block;height:1px;margin-top:-1px;background:#d8dbe2;transform-origin:0 0;text-decoration:none;transform:scaleX(0)}
</style>
</head>
<body>
<script src="studio:three"></script>
<div class="cap"><b>Vinyl Supernova</b><br>Ziehen = Kamera · eine Zeitleiste: Scheibe, Zerfall, Wolke, Rückbau</div>
<div class="ph" aria-hidden="true"><i></i><u id="bar"></u></div>
<script>
(() => {
'use strict';
const T = THREE;
const PARAMS = { speed: 1.4, explosion: 42, density: 1.0, duration: 8, tilt: 0.35, glow: 0.65, count: 36000 };   // sechs Regler, mehr braucht das Design nicht
const hp = new URLSearchParams(location.hash.slice(1)), tOff = parseFloat(hp.get('t')) || 0;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5)); renderer.setSize(innerWidth, innerHeight); renderer.setClearColor(0x020203, 1);
document.body.prepend(renderer.domElement);
const scene = new T.Scene(), camera = new T.PerspectiveCamera(60, innerWidth / innerHeight, .1, 2000);

/* ---------- Partikel: pro Index fünf deterministische Hashes (Goldener Schnitt), alles Weitere im Shader ---------- */
const N = PARAMS.count, A = new Float32Array(N * 4), B = new Float32Array(N);
const frac = x => x - Math.floor(x);
for (let i = 0; i < N; i++) { A[i * 4] = frac(i * 0.618033988749895); A[i * 4 + 1] = frac(i * 0.7548776662466927); A[i * 4 + 2] = frac(i * 0.5698402909980532); A[i * 4 + 3] = frac(i * 0.438579021); B[i] = frac(i * 0.328173921); }
const geo = new T.BufferGeometry();
geo.setAttribute('position', new T.BufferAttribute(new Float32Array(N * 3), 3)); geo.setAttribute('aA', new T.BufferAttribute(A, 4)); geo.setAttribute('aB', new T.BufferAttribute(B, 1));
geo.boundingSphere = new T.Sphere(new T.Vector3(), 400);                       // Positionen entstehen im Shader: Frustum-Culling braucht eine feste Kugel

const mat = new T.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uTime: { value: 0 }, uSpeed: { value: PARAMS.speed }, uExp: { value: PARAMS.explosion }, uDen: { value: PARAMS.density }, uDur: { value: PARAMS.duration },
    uTilt: { value: PARAMS.tilt }, uGlow: { value: PARAMS.glow }, uK: { value: 1 } },
  vertexShader: `
    uniform float uTime,uSpeed,uExp,uDen,uDur,uTilt,uGlow,uK; attribute vec4 aA; attribute float aB; varying vec3 vCol; varying float vOp;
    const float TAU=6.28318530718;
    float sm(float x){x=clamp(x,0.,1.);return x*x*(3.-2.*x);}
    vec3 hsl(vec3 c){vec3 rgb=clamp(abs(mod(c.x*6.+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);return c.z+c.y*(rgb-.5)*(1.-abs(2.*c.z-1.));}
    void main(){
      float h1=aA.x,h2=aA.y,h3=aA.z,h4=aA.w,h5=aB;
      // Zeitleiste: 0-.24 Scheibe dreht | .24-.45 Zerfall | .45-.61 Wolke | .61-.91 magnetischer Rückbau | Rest: Scheibe ruht
      float phase=fract(uTime/max(uDur,.01));
      float burst=sm((phase-.24)/.21), reform=sm((phase-.61)/.30), ex=burst*(1.-reform);
      // Scheibe: gleichmäßig verteilt (sqrt), Rillen als winzige Höhe, Neigung um X
      float r=sqrt(h1)*32., ang=h2*TAU+uTime*uSpeed, groove=sin(r*8.5), fine=sin(r*31.);
      vec3 v=vec3(cos(ang)*r,sin(ang)*r,groove*.065+fine*.018);
      float ct=cos(uTilt),st=sin(uTilt); v.yz=vec2(v.y*ct-v.z*st,v.y*st+v.z*ct);
      // Explosion: Richtung gleichverteilt auf der Kugel, Weg pro Partikel ungleich (pow), Wirbel dreht die Richtung mit dem Zerfall
      float th=h3*TAU,sz=h4*2.-1.,sr=sqrt(max(0.,1.-sz*sz)); vec3 d=vec3(cos(th)*sr,sin(th)*sr,sz);
      float travel=uExp*(.3+pow(h5,.65)*1.25)*uDen, sw=ex*(2.5+h3*7.), ca=cos(sw),sa=sin(sw);
      vec3 e=v+vec3(d.x*ca-d.y*sa,d.x*sa+d.y*ca,d.z*.8)*travel;
      float t1=sin(h1*83.+phase*TAU)*cos(h2*71.-phase*TAU), t2=sin(h3*97.-phase*TAU)*cos(h4*59.+phase*TAU), orb=ex*sin(phase*TAU)*4.;
      vec3 p=mix(v,e,ex); p.x+=t1*ex*6.+orb*d.y; p.y+=t2*ex*6.-orb*d.x; p.z+=(t1+t2)*ex*4.; p.xy+=sin(uTime*3.+h2*100.)*.025*(1.-ex);
      // Material: graphitfarbene Platte, reflektierende Rillenbänder, rotes Label mit Ring, silberne Spindel, Randglanz
      bool lab=r<8.2&&r>=.9; float refl=pow(max(0.,sin(r*3.4)),8.);
      float wedge=pow(max(0.,cos(2.*(ang-.9))),10.)*smoothstep(8.,12.,r);     // zwei helle Lichtkeile wie auf echtem Vinyl
      float hue=0.,sat=0.,li=.10+refl*.12+(groove+1.)*.03+pow(max(0.,fine),12.)*.05+wedge*.2;
      if(lab){hue=.985;sat=.75;li=.27+sin(r*5.)*.045;if(r>6.8&&r<7.2){li=.65;sat=.18;}}
      if(r<1.7&&r>=.9){hue=.58;sat=.08;li=.75;}
      if(r>31.4){li=.38+h3*.22;sat=.04;}
      float red=lab?.75:0., pH=.58+h2*.04,pS=.04+h3*.12,pL=.45+h4*.42;   // Staub: silbrig, das Label bleibt rot (Identität)
      float fH=hue*(1.-ex)+(pH*(1.-red)+.985*red)*ex, fS=sat*(1.-ex)+(pS*(1.-red)+.7*red)*ex, fL=li*(1.-ex)+pL*ex*uGlow;
      vCol=hsl(vec3(clamp(fH,0.,1.),clamp(fS,0.,1.),clamp(fL,.02,.95)))*1.2;
      float spark=pow(max(0.,sin(uTime*5.+h3*80.)),12.);
      float size=(.48+h4*.55)*(1.-ex)+(.18+h5*.45+spark*.65)*ex;
      vOp=(r<.9)?0.:clamp((1.-ex)*.95+ex*(.48+h2*.45),0.,1.);
      vec4 mv=modelViewMatrix*vec4(p,1.); gl_Position=projectionMatrix*mv; gl_PointSize=max(1.,size*.62*uK/-mv.z);
    }`,
  fragmentShader: `varying vec3 vCol; varying float vOp; void main(){ float d=length(gl_PointCoord-.5); if(d>.5||vOp<.01) discard; gl_FragColor=vec4(vCol,vOp*smoothstep(.5,.28,d)); }`
});
scene.add(Object.assign(new T.Points(geo, mat), { frustumCulled: false }));

/* ---------- Nachbearbeitung: Bloom + Spuren (Afterimage) + ein Abschlusspass für Kontrast, Vignette, Korn ---------- */
const composer = new T.EffectComposer(renderer);
composer.addPass(new T.RenderPass(scene, camera));
const bloom = new T.UnrealBloomPass(new T.Vector2(innerWidth, innerHeight), .5, .35, .3); composer.addPass(bloom);

class Trails extends T.Pass {                                                           // eigener Afterimage-Pass: max(neu, alt*damp), zwei Ziele im Wechsel
  constructor(damp) { super(); this.damp = damp; const s = innerWidth, h = innerHeight, o = { minFilter: T.LinearFilter, magFilter: T.LinearFilter, format: T.RGBAFormat, type: T.HalfFloatType };
    this.a = new T.WebGLRenderTarget(s, h, o); this.b = new T.WebGLRenderTarget(s, h, o);
    this.comp = new T.FullScreenQuad(new T.ShaderMaterial({ uniforms: { tNew: { value: null }, tOld: { value: null }, damp: { value: damp } },
      vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
      fragmentShader: 'uniform sampler2D tNew,tOld;uniform float damp;varying vec2 vUv;void main(){gl_FragColor=max(texture2D(tNew,vUv),texture2D(tOld,vUv)*damp);}' }));
    this.copy = new T.FullScreenQuad(new T.ShaderMaterial({ uniforms: { t: { value: null } }, vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
      fragmentShader: 'uniform sampler2D t;varying vec2 vUv;void main(){gl_FragColor=texture2D(t,vUv);}' })); }
  setSize(w, h) { this.a.setSize(w, h); this.b.setSize(w, h); }
  render(renderer, write, read) {
    this.comp.material.uniforms.tNew.value = read.texture; this.comp.material.uniforms.tOld.value = this.b.texture; this.comp.material.uniforms.damp.value = this.damp;
    renderer.setRenderTarget(this.a); this.comp.render(renderer);
    this.copy.material.uniforms.t.value = this.a.texture; renderer.setRenderTarget(this.renderToScreen ? null : write); if (this.clear) renderer.clear(); this.copy.render(renderer);
    const t = this.a; this.a = this.b; this.b = t;
  }
}
const trails = new Trails(.62); composer.addPass(trails);
const grade = new T.ShaderPass({ uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVig: { value: .9 }, uGrain: { value: .035 } },
  vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: `uniform sampler2D tDiffuse;uniform float uTime,uVig,uGrain;varying vec2 vUv;
    float hs(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
    void main(){ vec3 c=texture2D(tDiffuse,vUv).rgb; c=(c-.5)*1.15+.5; float l=dot(c,vec3(.2126,.7152,.0722)); c=mix(vec3(l),c,.9);
      vec2 u=vUv-.5; c=mix(c,vec3(.008,.008,.012),clamp(dot(u,u)*uVig,0.,1.)); c+=(hs(vUv*vec2(1920.,1080.)+fract(uTime)*37.)-.5)*uGrain; gl_FragColor=vec4(max(c,0.),1.); }` });
composer.addPass(grade);

/* ---------- Kamera: langsames Umkreisen, per Ziehen übernehmbar ---------- */
let az = 0, el = 0, drag = null, userUntil = 0;
renderer.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, az, el }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', e => { if (!drag) return; az = drag.az - (e.clientX - drag.x) * .006; el = Math.max(-1.2, Math.min(1.2, drag.el + (e.clientY - drag.y) * .005)); userUntil = performance.now() + 2500; });
addEventListener('pointerup', () => { drag = null; });
const size = () => { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  mat.uniforms.uK.value = h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360)); trails.setSize(w * renderer.getPixelRatio(), h * renderer.getPixelRatio()); };
addEventListener('resize', size); size();

const clock = new T.Clock(), bar = document.getElementById('bar');
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), time = reduced ? 1.2 : clock.elapsedTime + tOff;
  if (!reduced && !drag && performance.now() > userUntil) az += dt * (Math.PI * 2 / 30) * .5;       // wie autoRotate: halbe Geschwindigkeit, damit die Scheibe lang genug flach im Bild bleibt
  const ph = (time / PARAMS.duration) % 1, sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
  const ex = sm((ph - .24) / .21) * (1 - sm((ph - .61) / .30));            // dieselbe Kurve wie im Shader: die Kamera zieht beim Zerfall zurück, die Wolke wird als Kugel lesbar
  const R = 100 + 85 * ex, cy = Math.cos(el);
  camera.position.set(R * Math.sin(az) * cy, R * Math.sin(el), R * Math.cos(az) * cy); camera.lookAt(0, 0, 0);
  mat.uniforms.uTime.value = time; grade.uniforms.uTime.value = time; bar.style.transform = `scaleX(${((time / PARAMS.duration) % 1).toFixed(4)})`;
  composer.render(dt);
})();
})();
</script>
</body>
</html>
